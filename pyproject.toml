[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chenki"
version = "0.1.0"
description = "Self-hostable LLM client for restaurant tech."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Brian Chen", email = "brianchen.crisp@gmail.com" }
]
keywords = ["llm", "openai", "chat", "restaurant", "self-hosted", "huggingface"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
cache = []
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.20", "pytest-cov>=5.0"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]

[project.urls]
Homepage = "https://chenki.com"
Repository = "https://github.com/brianchenhao/chenki"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
markers = [
    "live: hits the real chenki-llm HF Space; skipped unless --live is passed",
]

[tool.coverage.run]
source = ["src/chenki"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise RuntimeError\\(\"retry loop",
    "if TYPE_CHECKING:",
]
